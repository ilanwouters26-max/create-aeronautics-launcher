# Construit l'installeur Windows de Telek Panel et le dépose en artefact du run
# (onglet Actions du dépôt). Volontairement sans Release : les releases de ce
# dépôt servent à la mise à jour automatique du launcher Create Aeronautics.
name: Telek Panel (installeur Windows)

on:
  push:
    branches: [base-panel]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"
      - "svelte.config.js"
      - "tsconfig.json"
      - ".github/workflows/build-panel.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dépendances frontend
        run: npm ci

      - name: Tests du cœur Rust
        run: cargo test --manifest-path src-tauri/core/Cargo.toml

      - name: Build de l'installeur
        run: npm run tauri build

      - name: Installeur en artefact
        uses: actions/upload-artifact@v4
        with:
          name: telek-panel-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 90
          if-no-files-found: error
