[package]
name = "telek-panel"
version = "0.1.0"
description = "Panneau de gestion Minecraft : serveurs, client, launcher"
edition = "2021"
rust-version = "1.80"

[workspace]
members = ["core"]

[lib]
name = "telek_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
panel-core = { path = "core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = "0.4.45"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
